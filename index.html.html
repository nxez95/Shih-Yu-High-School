<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>私立時雨中學 三年己班｜同學近況與位置圈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    #map { height: 420px; width: 100%; border-radius: 0.75rem; z-index: 1; }
    .leaflet-popup-content-wrapper { border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- 通關驗證畫面 -->
  <div id="gateModal" class="fixed inset-0 bg-slate-900/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
      <div class="text-center mb-5">
        <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full mb-2">校友專屬空間</span>
        <h1 class="text-2xl font-bold text-slate-900">私立時雨中學 三年己班</h1>
        <p class="text-sm text-slate-500 mt-1">請輸入班級通關密語以瀏覽近況與位置圈</p>
      </div>
      <div class="space-y-3">
        <input id="passcodeInput" type="password" placeholder="請輸入通關密語"
          class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        <p id="gateError" class="text-xs text-rose-600 hidden">通關密語不正確，請重新輸入。</p>
        <button onclick="verifyPasscode()"
          class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition">
          進入班級頁面
        </button>
      </div>
    </div>
  </div>

  <!-- 主頁面容器 -->
  <div id="appContent" class="hidden max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- 頁首 -->
    <header class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-xl md:text-2xl font-bold text-slate-900">私立時雨中學 三年己班</h1>
          <span id="syncBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-medium">已連線試算表</span>
        </div>
        <p class="text-sm text-slate-500 mt-1">登錄近況、照片與生活圈位置（地圖採 1.5～3 公里模糊定位保護隱私）</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="openProfileModal()"
          class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm transition">
          ＋ 登錄 / 更新我的資料
        </button>
        <button onclick="fetchAllData()"
          class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-xl transition">
          重新整理
        </button>
      </div>
    </header>

    <!-- Google 地圖模糊定位區 -->
    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <div>
          <h2 class="text-lg font-bold text-slate-900">目前生活圈地圖</h2>
          <p class="text-xs text-slate-500">顯示自己與同學的模糊位置範圍圈，點擊圓圈可檢視同學資訊與距離</p>
        </div>
        <div class="flex flex-wrap items-center gap-2 text-xs">
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 font-medium">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>我的位置圈
          </span>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-50 text-amber-700 font-medium">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>同生活圈（10km 內）
          </span>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-medium">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>其他同學
          </span>
        </div>
      </div>

      <div id="map"></div>

      <!-- 附近同學提示列 -->
      <div id="nearbyBanner" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-900 flex flex-wrap items-center justify-between gap-2">
        <div id="nearbyText"></div>
      </div>
    </section>

    <!-- 篩選列與同學卡片列表 -->
    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <h2 class="text-lg font-bold text-slate-900">同學動態牆（<span id="memberCount">0</span> 人）</h2>
        <div class="flex gap-2">
          <input id="searchInput" type="text" oninput="renderMembers()" placeholder="搜尋姓名、居住地或工作地..."
            class="px-3.5 py-2 bg-white border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none w-full sm:w-64" />
        </div>
      </div>

      <div id="membersGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </section>
  </div>

  <!-- 登錄 / 編輯個人資料 Modal -->
  <div id="profileModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-40 hidden overflow-y-auto p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full mx-auto my-8 p-6 shadow-2xl border border-slate-200 space-y-5">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="text-xl font-bold text-slate-900">登錄 / 更新個人資料</h3>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <div class="space-y-4">
        <!-- 姓名 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">姓名 <span class="text-rose-500">*</span></label>
          <input id="formName" type="text" placeholder="請輸入真實姓名或慣用稱呼"
            class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>

        <!-- 近照上傳（最多 4 張） -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">近照分享（選填，最多 4 張，自動壓縮）</label>
          <input id="photoInput" type="file" accept="image/*" multiple onchange="handlePhotoUpload(event)"
            class="block w-full text-sm text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
          <div id="uploadedPhotosPreview" class="grid grid-cols-4 gap-2.5 mt-3"></div>
        </div>

        <!-- 頭貼選擇（從上傳近照挑選 或 內建卡通頭像） -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
          <label class="block text-sm font-semibold text-slate-700">選擇個人頭貼（可從上方近照指定，或選用內建卡通圖）</label>
          <div id="avatarPhotoChoices" class="flex flex-wrap gap-2"></div>
          <div class="text-xs text-slate-500 pt-1">內建卡通頭像：</div>
          <div id="cartoonAvatarChoices" class="grid grid-cols-4 sm:grid-cols-8 gap-2"></div>
        </div>

        <!-- 居住地（多選） -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">居住地（可複選，適合常移動者）</label>
          <div id="residenceCheckboxes" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- 工作地（多選） -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">工作地（可複選，適合常出差或跨區工作者）</label>
          <div id="workplaceCheckboxes" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- 近況與聯絡方式（選填，無預設尷尬文字） -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">近期狀態 / 備註（選填）</label>
            <input id="formBio" type="text" placeholder="選填"
              class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">公開聯絡方式（選填）</label>
            <input id="formContact" type="text" placeholder="例如 LINE ID / IG（選填）"
              class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
        </div>

        <!-- 模糊位置設定 -->
        <div class="bg-blue-50/70 p-4 rounded-xl border border-blue-200 space-y-2.5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <span class="text-sm font-semibold text-slate-800">模糊位置圈（選填）</span>
              <p class="text-xs text-slate-600">系統會自動加上 1.5～3 公里隨機偏移，不會顯示精確地址</p>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="grabFuzzyGPS()"
                class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition">
                取得目前模糊定位
              </button>
              <button type="button" onclick="clearLocation()"
                class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-medium rounded-lg transition">
                清除位置
              </button>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-2 text-xs text-slate-700">
            <span>或直接選擇常駐城市產生模糊圈：</span>
            <select id="cityQuickSelect" onchange="applyCityPreset(this.value)"
              class="px-2.5 py-1 bg-white border border-slate-300 rounded-lg text-xs">
              <option value="">-- 選擇區域 --</option>
              <option value="25.0330,121.5654">台北市</option>
              <option value="25.0169,121.4628">新北市</option>
              <option value="25.1276,121.7392">基隆市</option>
              <option value="24.9936,121.3010">桃園市</option>
              <option value="24.8138,120.9675">新竹縣市</option>
              <option value="24.1477,120.6736">台中市</option>
              <option value="22.9999,120.2269">台南市</option>
              <option value="22.6273,120.3014">高雄市</option>
              <option value="24.7021,121.7377">宜蘭縣</option>
              <option value="23.9872,121.6015">花蓮縣</option>
            </select>
            <span id="locationStatusText" class="font-medium text-blue-700">尚未設定位置</span>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
        <button onclick="closeProfileModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
        <button id="saveBtn" onclick="saveProfile()"
          class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm transition">
          儲存並同步至班級頁面
        </button>
      </div>
    </div>
  </div>

  <!-- 照片大圖燈箱 -->
  <div id="lightboxModal" onclick="closeLightbox()" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4">
    <img id="lightboxImg" src="" class="max-h-[85vh] max-w-[92vw] rounded-xl shadow-2xl object-contain" />
  </div>

  <script>
    // ==========================================
    // 1. 設定區：請將此處換成你的 Google Apps Script 部署網址
    // ==========================================
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbxSL132Hq5zTX0C5jvof5ZzQWHpS-ecrZ_emV9rtqZSR3dm1lRARkRkbnL0hiGi66L3LA/exec";
    const STORAGE_KEY_ID = "shihyu36_my_id";
    const STORAGE_KEY_CODE = "shihyu36_passcode";

    const REGION_OPTIONS = [
      "台北市", "新北市", "基隆市", "桃園市", "新竹縣市",
      "苗栗縣", "台中市", "彰化縣", "南投縣", "雲林縣",
      "嘉義縣市", "台南市", "高雄市", "屏東縣", "宜蘭縣",
      "花蓮縣", "台東縣", "澎金馬離島", "海外 / 經常出差"
    ];

    // 內建 8 款簡約卡通 SVG 頭像
    const CARTOON_AVATARS = {
      c1: `<svg viewBox="0 0 80 80" class="w-full h-full"><rect width="80" height="80" rx="40" fill="#DBEAFE"/><circle cx="40" cy="34" r="15" fill="#FDBA74"/><path d="M25 30 Q40 14 55 30" fill="#1E293B"/><circle cx="35" cy="34" r="2" fill="#1E293B"/><circle cx="45" cy="34" r="2" fill="#1E293B"/><path d="M36 41 Q40 44 44 41" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18 72 Q40 52 62 72" fill="#3B82F6"/></svg>`,
      c2: `<svg viewBox="0 0 80 80" class="w-full h-full"><rect width="80" height="80" rx="40" fill="#FCE7F3"/><circle cx="40" cy="35" r="15" fill="#FED7AA"/><path d="M23 36 Q24 16 40 16 Q56 16 57 36 L59 50 L21 50 Z" fill="#475569"/><circle cx="35" cy="35" r="2" fill="#1E293B"/><circle cx="45" cy="35" r="2" fill="#1E293B"/><path d="M36 42 Q40 45 44 42" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M20 72 Q40 54 60 72" fill="#EC4899"/></svg>`,
      c3: `<svg viewBox="0 0 80 80" class="w-full h-full"><rect width="80" height="80" rx="40" fill="#DCFCE7"/><circle cx="40" cy="35" r="15" fill="#FDBA74"/><rect x="31" y="31" width="7" height="5" rx="1" stroke="#1E293B" stroke-width="1.8" fill="none"/><rect x="42" y="31" width="7" height="5" rx="1" stroke="#1E293B" stroke-width="1.8" fill="none"/><line x1="38" y1="33" x2="42" y2="33" stroke="#1E293B" stroke-width="1.8"/><path d="M37 42 L43 42" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M18 72 Q40 52 62 72" fill="#10B981"/></svg>`,
      c4: `<svg viewBox="0 0 80 80" class="w-full h-full"><rect width="80" height="80" rx="40" fill="#FEF3C7"/><circle cx="40" cy="42" r="20" fill="#F59E0B"/><polygon points="24,28 28,14 36,24" fill="#F59E0B"/><polygon points="56,28 52,14 44,24" fill="#F59E0B"/><circle cx="33" cy="40" r="2.5" fill="#1E293B"/><circle cx="47" cy="40" r="2.5" fill="#1E293B"/><polygon points="38,45 42,45 40,48" fill="#1E293B"/></svg>`,
      c5: `<svg viewBox="0 0 80 80" class="w-full h-full"><rect width="80" height="80" rx="40" fill="#E0E7FF"/><circle cx="24" cy="24" r="7" fill="#334155"/><circle cx="56" cy="24" r="7" fill="#334155"/><circle cx="40" cy="42" r="20" fill="#FFFFFF"/><ellipse cx="33" cy="40" rx="4.5" ry="5.5" fill="#334155"/><ellipse cx="47" cy="40" rx="4.5" ry="5.5" fill="#334155"/><circle cx="34" cy="39" r="1.5" fill="#FFF"/><circle cx="46" cy="39" r="1.5" fill="#FFF"/><ellipse cx="40" cy="46" rx="3" ry="2" fill="#1E293B"/></svg>`,
      c6: `<svg viewBox="0 0 80 80" class="w-full h-full"><rect width="80" height="80" rx="40" fill="#CCFBF1"/><ellipse cx="26" cy="42" rx="6" ry="12" fill="#92400E"/><ellipse cx="54" cy="42" rx="6" ry="12" fill="#92400E"/><circle cx="40" cy="42" r="18" fill="#D97706"/><circle cx="34" cy="39" r="2.3" fill="#1E293B"/><circle cx="46" cy="39" r="2.3" fill="#1E293B"/><ellipse cx="40" cy="46" rx="4" ry="3" fill="#1E293B"/></svg>`,
      c7: `<svg viewBox="0 0 80 80" class="w-full h-full"><rect width="80" height="80" rx="40" fill="#F3E8FF"/><rect x="22" y="26" width="36" height="30" rx="8" fill="#6366F1"/><line x1="40" y1="16" x2="40" y2="26" stroke="#6366F1" stroke-width="3"/><circle cx="40" cy="14" r="3.5" fill="#F43F5E"/><circle cx="33" cy="39" r="3.5" fill="#FEF08A"/><circle cx="47" cy="39" r="3.5" fill="#FEF08A"/><rect x="32" y="47" width="16" height="3" rx="1.5" fill="#E0E7FF"/></svg>`,
      c8: `<svg viewBox="0 0 80 80" class="w-full h-full"><rect width="80" height="80" rx="40" fill="#FFE4E6"/><circle cx="40" cy="43" r="19" fill="#FB7185"/><circle cx="33" cy="40" r="2.5" fill="#1E293B"/><circle cx="47" cy="40" r="2.5" fill="#1E293B"/><ellipse cx="40" cy="47" rx="6" ry="4" fill="#FDA4AF"/><circle cx="38" cy="47" r="1.2" fill="#881337"/><circle cx="42" cy="47" r="1.2" fill="#881337"/></svg>`
    };

    let state = {
      passcode: localStorage.getItem(STORAGE_KEY_CODE) || "",
      myId: localStorage.getItem(STORAGE_KEY_ID) || ("m_" + Math.random().toString(36).slice(2, 10)),
      members: [],
      comments: [],
      formPhotos: [],
      formAvatarType: "cartoon",
      formAvatarValue: "c1",
      formLat: null,
      formLng: null,
      formRadius: 2000
    };
    localStorage.setItem(STORAGE_KEY_ID, state.myId);

    let mapInstance = null;
    let mapLayersGroup = null;

    // 初始化檢查
    window.addEventListener("DOMContentLoaded", () => {
      initFormOptions();
      if (state.passcode) {
        document.getElementById("passcodeInput").value = state.passcode;
        verifyPasscode(true);
      }
    });

    async function verifyPasscode(silent = false) {
      const code = document.getElementById("passcodeInput").value.trim();
      if (!code) return;
      state.passcode = code;
      const ok = await fetchAllData();
      if (ok) {
        localStorage.setItem(STORAGE_KEY_CODE, code);
        document.getElementById("gateModal").classList.add("hidden");
        document.getElementById("appContent").classList.remove("hidden");
        initGoogleMap();
        renderAll();
      } else if (!silent) {
        document.getElementById("gateError").classList.remove("hidden");
      }
    }

    // 初始化 Google 地圖底圖（透過 Leaflet 載入 Google Map 圖磚）
    function initGoogleMap() {
      if (mapInstance) return;
      mapInstance = L.map("map").setView([25.0330, 121.5654], 10);

      const googleStreets = L.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", {
        maxZoom: 19,
        attribution: "Google Maps"
      });
      const googleHybrid = L.tileLayer("https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}", {
        maxZoom: 19,
        attribution: "Google Hybrid"
      });

      googleStreets.addTo(mapInstance);
      L.control.layers({ "Google 標準地圖": googleStreets, "Google 衛星混合": googleHybrid }).addTo(mapInstance);
      mapLayersGroup = L.layerGroup().addTo(mapInstance);
    }

    async function fetchAllData() {
      const badge = document.getElementById("syncBadge");
      badge.textContent = "同步中...";
      try {
        if (DEFAULT_GAS_URL.includes("請替換為你的部署ID")) {
          // 尚未設定 GAS 網址時的本機暫存模式
          state.members = JSON.parse(localStorage.getItem("shihyu36_demo_members") || "[]");
          state.comments = JSON.parse(localStorage.getItem("shihyu36_demo_comments") || "[]");
          badge.textContent = "本機預覽模式（尚未填入試算表網址）";
          badge.className = "text-xs px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 font-medium";
          if (mapInstance) renderAll();
          return true;
        }

        const res = await fetch(`${DEFAULT_GAS_URL}?code=${encodeURIComponent(state.passcode)}`);
        const data = await res.json();
        if (!data.ok) return false;
        state.members = data.members || [];
        state.comments = data.comments || [];
        badge.textContent = "已連線 Google 試算表";
        badge.className = "text-xs px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-medium";
        if (mapInstance) renderAll();
        return true;
      } catch (e) {
        badge.textContent = "連線異常";
        badge.className = "text-xs px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 font-medium";
        return false;
      }
    }

    function renderAll() {
      renderMapCircles();
      renderMembers();
    }

    function renderMapCircles() {
      if (!mapLayersGroup) return;
      mapLayersGroup.clearLayers();

      const me = state.members.find(m => m.id === state.myId);
      const bounds = [];
      const nearbyList = [];

      state.members.forEach(m => {
        if (m.lat == null || m.lng == null || isNaN(m.lat) || isNaN(m.lng)) return;
        const isMe = m.id === state.myId;
        let distKm = null;
        if (!isMe && me && me.lat != null && me.lng != null) {
          distKm = calcDistanceKm(me.lat, me.lng, m.lat, m.lng);
          if (distKm <= 10) nearbyList.push({ name: m.name, dist: distKm.toFixed(1) });
        }

        const isNear = distKm !== null && distKm <= 10;
        const color = isMe ? "#2563EB" : (isNear ? "#D97706" : "#059669");

        const circle = L.circle([m.lat, m.lng], {
          radius: m.radius || 2000,
          color: color,
          fillColor: color,
          fillOpacity: 0.22,
          weight: 2
        }).addTo(mapLayersGroup);

        const subText = isMe
          ? "我的模糊位置圈"
          : (distKm !== null ? `距離約 ${distKm.toFixed(1)} 公里` : "已分享模糊位置");

        circle.bindPopup(`
          <div class="text-sm">
            <div class="font-bold text-slate-900">${escapeHtml(m.name)}</div>
            <div class="text-xs text-slate-500 mt-0.5">${subText}</div>
            ${m.residences?.length ? `<div class="text-xs mt-1">居住：${escapeHtml(m.residences.join("、"))}</div>` : ""}
          </div>
        `);

        bounds.push([m.lat, m.lng]);
      });

      const banner = document.getElementById("nearbyBanner");
      if (nearbyList.length > 0) {
        banner.classList.remove("hidden");
        document.getElementById("nearbyText").innerHTML =
          `目前同生活圈（10 公里內）的同學：` +
          nearbyList.map(n => `<strong>${escapeHtml(n.name)}</strong>（約 ${n.dist} km）`).join("、");
      } else {
        banner.classList.add("hidden");
      }

      if (bounds.length > 0) {
        mapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
      }
    }

    function renderMembers() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const filtered = state.members.filter(m => {
        if (!keyword) return true;
        const pool = [
          m.name,
          ...(m.residences || []),
          ...(m.workplaces || []),
          m.bio || ""
        ].join(" ").toLowerCase();
        return pool.includes(keyword);
      });

      document.getElementById("memberCount").textContent = filtered.length;
      const grid = document.getElementById("membersGrid");

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full bg-white rounded-2xl p-8 text-center text-slate-400 border border-slate-200">目前尚無符合條件的同學資料，點選右上角「登錄 / 更新我的資料」即可新增。</div>`;
        return;
      }

      grid.innerHTML = filtered.map(m => {
        const memberComments = state.comments.filter(c => String(c.memberId) === String(m.id));
        const avatarHtml = renderAvatarHtml(m, "w-14 h-14");

        const resTags = (m.residences || []).map(r =>
          `<span class="px-2 py-0.5 bg-sky-50 text-sky-700 rounded-md text-xs font-medium">居｜${escapeHtml(r)}</span>`
        ).join("");
        const workTags = (m.workplaces || []).map(w =>
          `<span class="px-2 py-0.5 bg-violet-50 text-violet-700 rounded-md text-xs font-medium">工｜${escapeHtml(w)}</span>`
        ).join("");

        const photosHtml = (m.photos && m.photos.length > 0)
          ? `<div class="grid grid-cols-4 gap-2 mt-3">
              ${m.photos.map(src => `
                <img src="${src}" onclick="openLightbox('${src}')"
                  class="w-full h-20 object-cover rounded-lg cursor-pointer hover:opacity-90 border border-slate-200" />
              `).join("")}
            </div>`
          : "";

        const commentsHtml = memberComments.map(c => `
          <div class="bg-slate-50 rounded-lg px-3 py-2 text-xs">
            <span class="font-semibold text-slate-800">${escapeHtml(c.author)}：</span>
            <span class="text-slate-700">${escapeHtml(c.text)}</span>
          </div>
        `).join("");

        return `
          <article class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between space-y-4">
            <div>
              <div class="flex items-start justify-between gap-3">
                <div class="flex items-center gap-3">
                  <div class="w-14 h-14 rounded-full overflow-hidden border border-slate-200 shrink-0 bg-slate-100">
                    ${avatarHtml}
                  </div>
                  <div>
                    <div class="flex items-center gap-2">
                      <h3 class="text-base font-bold text-slate-900">${escapeHtml(m.name)}</h3>
                      ${m.id === state.myId ? `<span class="text-[11px] px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full font-semibold">本人</span>` : ""}
                    </div>
                    ${m.contact ? `<div class="text-xs text-slate-500 mt-0.5">聯絡：${escapeHtml(m.contact)}</div>` : ""}
                  </div>
                </div>
                ${m.id === state.myId ? `<button onclick="openProfileModal()" class="text-xs text-indigo-600 hover:underline font-medium">編輯</button>` : ""}
              </div>

              ${(resTags || workTags) ? `<div class="flex flex-wrap gap-1.5 mt-3">${resTags}${workTags}</div>` : ""}
              ${m.bio ? `<p class="text-sm text-slate-700 mt-3 leading-relaxed">${escapeHtml(m.bio)}</p>` : ""}
              ${photosHtml}
            </div>

            <!-- 留言區 -->
            <div class="pt-3 border-t border-slate-100 space-y-2">
              <div class="text-xs font-semibold text-slate-500">留言區（${memberComments.length}）</div>
              <div class="space-y-1.5 max-h-36 overflow-y-auto">${commentsHtml}</div>
              <div class="flex gap-2 pt-1">
                <input id="commentInput_${m.id}" type="text" placeholder="寫下留言..."
                  class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                <button onclick="submitComment('${m.id}')"
                  class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium rounded-lg transition">
                  送出
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderAvatarHtml(m, sizeClass) {
      if (m.avatarType === "photo" && m.photos && m.photos[Number(m.avatarValue)]) {
        return `<img src="${m.photos[Number(m.avatarValue)]}" class="${sizeClass} object-cover" />`;
      }
      return CARTOON_AVATARS[m.avatarValue] || CARTOON_AVATARS.c1;
    }

    // 表單選項初始化
    function initFormOptions() {
      const renderPills = (containerId, prefix) => {
        document.getElementById(containerId).innerHTML = REGION_OPTIONS.map(r => `
          <label class="cursor-pointer">
            <input type="checkbox" name="${prefix}" value="${r}" class="peer hidden" />
            <span class="inline-block px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-600 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition select-none">
              ${r}
            </span>
          </label>
        `).join("");
      };
      renderPills("residenceCheckboxes", "resOpt");
      renderPills("workplaceCheckboxes", "workOpt");

      document.getElementById("cartoonAvatarChoices").innerHTML = Object.keys(CARTOON_AVATARS).map(key => `
        <button type="button" onclick="selectAvatar('cartoon', '${key}')" id="avatarBtn_cartoon_${key}"
          class="w-11 h-11 rounded-full overflow-hidden border-2 border-transparent hover:border-indigo-400 transition">
          ${CARTOON_AVATARS[key]}
        </button>
      `).join("");
    }

    function openProfileModal() {
      const me = state.members.find(m => m.id === state.myId);
      document.getElementById("formName").value = me ? me.name : "";
      document.getElementById("formBio").value = me ? (me.bio || "") : "";
      document.getElementById("formContact").value = me ? (me.contact || "") : "";
      state.formPhotos = me && me.photos ? [...me.photos] : [];
      state.formAvatarType = me ? (me.avatarType || "cartoon") : "cartoon";
      state.formAvatarValue = me ? (me.avatarValue || "c1") : "c1";
      state.formLat = me && me.lat != null ? me.lat : null;
      state.formLng = me && me.lng != null ? me.lng : null;

      document.querySelectorAll('input[name="resOpt"]').forEach(el => {
        el.checked = me && Array.isArray(me.residences) && me.residences.includes(el.value);
      });
      document.querySelectorAll('input[name="workOpt"]').forEach(el => {
        el.checked = me && Array.isArray(me.workplaces) && me.workplaces.includes(el.value);
      });

      updateLocationStatusText();
      renderUploadedPhotosPreview();
      highlightSelectedAvatar();
      document.getElementById("profileModal").classList.remove("hidden");
    }

    function closeProfileModal() {
      document.getElementById("profileModal").classList.add("hidden");
    }

    // 圖片壓縮處理（確保可穩定存入 Google 試算表儲存格）
    async function handlePhotoUpload(e) {
      const files = Array.from(e.target.files || []);
      for (const file of files) {
        if (state.formPhotos.length >= 4) break;
        const compressed = await compressImage(file, 380, 0.65);
        state.formPhotos.push(compressed);
      }
      e.target.value = "";
      renderUploadedPhotosPreview();
    }

    function compressImage(file, maxSide, quality) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width, h = img.height;
            if (w > h && w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; }
            else if (h >= w && h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function renderUploadedPhotosPreview() {
      const preview = document.getElementById("uploadedPhotosPreview");
      const avatarChoices = document.getElementById("avatarPhotoChoices");

      preview.innerHTML = state.formPhotos.map((src, idx) => `
        <div class="relative group">
          <img src="${src}" class="w-full h-20 object-cover rounded-lg border border-slate-200" />
          <button type="button" onclick="removePhoto(${idx})"
            class="absolute top-1 right-1 bg-black/70 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center">&times;</button>
        </div>
      `).join("");

      if (state.formPhotos.length > 0) {
        avatarChoices.innerHTML = state.formPhotos.map((src, idx) => `
          <button type="button" onclick="selectAvatar('photo', '${idx}')" id="avatarBtn_photo_${idx}"
            class="flex items-center gap-1.5 px-2.5 py-1 bg-white border-2 border-slate-200 rounded-full text-xs font-medium hover:border-indigo-400">
            <img src="${src}" class="w-6 h-6 rounded-full object-cover" />
            <span>設近照 ${idx + 1} 為頭貼</span>
          </button>
        `).join("");
      } else {
        avatarChoices.innerHTML = `<span class="text-xs text-slate-400">尚未上傳近照，目前使用下方內建卡通頭像</span>`;
      }
      highlightSelectedAvatar();
    }

    function removePhoto(idx) {
      state.formPhotos.splice(idx, 1);
      if (state.formAvatarType === "photo") {
        state.formAvatarType = "cartoon";
        state.formAvatarValue = "c1";
      }
      renderUploadedPhotosPreview();
    }

    function selectAvatar(type, val) {
      state.formAvatarType = type;
      state.formAvatarValue = val;
      highlightSelectedAvatar();
    }

    function highlightSelectedAvatar() {
      document.querySelectorAll("[id^='avatarBtn_']").forEach(btn => {
        btn.classList.remove("border-indigo-600", "ring-2", "ring-indigo-300");
      });
      const active = document.getElementById(`avatarBtn_${state.formAvatarType}_${state.formAvatarValue}`);
      if (active) active.classList.add("border-indigo-600", "ring-2", "ring-indigo-300");
    }

    // 模糊定位計算（加上 1.5 ~ 3 公里隨機偏移）
    function applyFuzzyOffset(lat, lng) {
      const distKm = 1.5 + Math.random() * 1.5;
      const angle = Math.random() * 2 * Math.PI;
      const dLat = (distKm / 111) * Math.cos(angle);
      const dLng = (distKm / (111 * Math.cos(lat * Math.PI / 180))) * Math.sin(angle);
      state.formLat = Number((lat + dLat).toFixed(4));
      state.formLng = Number((lng + dLng).toFixed(4));
      updateLocationStatusText();
    }

    function grabFuzzyGPS() {
      if (!navigator.geolocation) {
        alert("此瀏覽器不支援定位功能，請改用下方區域選單。");
        return;
      }
      document.getElementById("locationStatusText").textContent = "定位取得中...";
      navigator.geolocation.getCurrentPosition(
        pos => applyFuzzyOffset(pos.coords.latitude, pos.coords.longitude),
        () => {
          document.getElementById("locationStatusText").textContent = "未取得定位權限，可改選下方區域";
        }
      );
    }

    function applyCityPreset(val) {
      if (!val) return;
      const [lat, lng] = val.split(",").map(Number);
      applyFuzzyOffset(lat, lng);
    }

    function clearLocation() {
      state.formLat = null;
      state.formLng = null;
      document.getElementById("cityQuickSelect").value = "";
      updateLocationStatusText();
    }

    function updateLocationStatusText() {
      const el = document.getElementById("locationStatusText");
      el.textContent = (state.formLat != null && state.formLng != null)
        ? `已設定模糊圈（約 ${state.formLat}, ${state.formLng}）`
        : "尚未設定位置";
    }

    async function saveProfile() {
      const name = document.getElementById("formName").value.trim();
      if (!name) {
        alert("請填寫姓名");
        return;
      }
      const residences = Array.from(document.querySelectorAll('input[name="resOpt"]:checked')).map(el => el.value);
      const workplaces = Array.from(document.querySelectorAll('input[name="workOpt"]:checked')).map(el => el.value);

      const memberObj = {
        id: state.myId,
        name,
        avatarType: state.formAvatarType,
        avatarValue: state.formAvatarValue,
        residences,
        workplaces,
        bio: document.getElementById("formBio").value.trim(),
        contact: document.getElementById("formContact").value.trim(),
        lat: state.formLat,
        lng: state.formLng,
        radius: 2000,
        photos: state.formPhotos
      };

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.textContent = "儲存中...";

      try {
        if (DEFAULT_GAS_URL.includes("請替換為你的部署ID")) {
          const idx = state.members.findIndex(m => m.id === state.myId);
          if (idx >= 0) state.members[idx] = memberObj;
          else state.members.push(memberObj);
          localStorage.setItem("shihyu36_demo_members", JSON.stringify(state.members));
        } else {
          await fetch(DEFAULT_GAS_URL, {
            method: "POST",
            body: JSON.stringify({ code: state.passcode, action: "upsertMember", member: memberObj })
          });
          await fetchAllData();
        }
        closeProfileModal();
        renderAll();
      } finally {
        btn.disabled = false;
        btn.textContent = "儲存並同步至班級頁面";
      }
    }

    async function submitComment(memberId) {
      const input = document.getElementById(`commentInput_${memberId}`);
      const text = input.value.trim();
      if (!text) return;

      const me = state.members.find(m => m.id === state.myId);
      const author = me ? me.name : "三年己班同學";
      const commentObj = {
        id: "c_" + Date.now(),
        memberId,
        author,
        text
      };

      input.value = "";
      if (DEFAULT_GAS_URL.includes("請替換為你的部署ID")) {
        state.comments.push(commentObj);
        localStorage.setItem("shihyu36_demo_comments", JSON.stringify(state.comments));
        renderMembers();
      } else {
        await fetch(DEFAULT_GAS_URL, {
          method: "POST",
          body: JSON.stringify({ code: state.passcode, action: "addComment", comment: commentObj })
        });
        await fetchAllData();
      }
    }

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightboxModal").classList.remove("hidden");
    }
    function closeLightbox() {
      document.getElementById("lightboxModal").classList.add("hidden");
    }

    function calcDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
